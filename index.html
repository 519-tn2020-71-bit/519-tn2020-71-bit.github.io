<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>국어 수업 놀이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="hero">
  <div class="in">
    <div class="eb">경포고등학교 · 수업용 게임과 도구</div>
    <h1>국어 수업 놀이터</h1>
    <p>작품을 끝까지, 제대로 읽기 위해 만든 수업용 게임과 도구를 모아 둔 곳이에요. 설치나 계정 없이 주소만 열면 됩니다. 휴대폰, 크롬북, PC에서 모두 돼요.</p>
    <div class="acts"><a class="btn pri" href="qr.html">QR 한눈에 보기</a><a class="btn" href="yeonsu/">AI 연수 자료</a></div>
  </div>
</header>
<main class="wrap">
  <h2 class="sec">작품을 걸으며 읽는 게임<small id="nG"></small></h2>
  <div class="grid" id="games"></div>
  <h2 class="sec">수업 도구와 행사<small id="nT"></small></h2>
  <div class="grid" id="tools"></div>
</main>
<footer class="foot">만든이: 경포고등학교 한예지 · 게임 코드는 AI 도구(Claude)와 함께 만들었어요 · 그림은 AI로 생성했어요<br><span id="upd"></span></footer>
<script src="links.js"></script>
<script>
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const TINT=["c-blue","c-pink","c-green","c-amber","c-violet","c-teal"];
const card=(l,i)=>{
  const cover=l.img
    ?`<div class="cover img" style="background-image:url('${esc(l.img)}')"><span class="dt">${esc(l.work)}</span><span class="big">${esc(l.title)}</span></div>`
    :`<div class="cover ${TINT[i%TINT.length]}"><span class="dt">${esc(l.work)}</span><span class="big">${esc(l.title)}</span></div>`;
  return `<a class="card" href="${esc(l.url)}">${cover}<div class="body"><p>${esc(l.desc)}</p><span class="go">열기 →</span></div></a>`;
};
const G=LINKS.filter(l=>l.kind==="game"),T=LINKS.filter(l=>l.kind==="tool");
document.getElementById("games").innerHTML=G.map(card).join("");
document.getElementById("tools").innerHTML=T.map(card).join("");
document.getElementById("nG").textContent=G.length+"개";
document.getElementById("nT").textContent=T.length+"개";
const last=LINKS.map(l=>l.date).sort().pop();if(last){const [y,m]=last.split("-");document.getElementById("upd").textContent="마지막으로 더한 때: "+y+"년 "+(+m)+"월 · 모두 "+LINKS.length+"개";}
</script>
</body>
</html>
