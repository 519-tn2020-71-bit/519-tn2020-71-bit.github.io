<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR 한눈에 보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--paper:#f3ecdb;--paper2:#e8dfc8;--ink:#1d1813;--muted:#6b5f4c;--seal:#b3362b;--indigo:#2b4a6f;--bg:#161f31}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--paper);font-family:"IBM Plex Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
header{max-width:1240px;margin:0 auto;padding:30px 20px 6px;display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
header .eb{font-size:12px;letter-spacing:.2em;color:#e3c9a0}
h1{font-family:"Gowun Batang",serif;font-size:clamp(28px,5vw,42px);margin:4px 0 6px;line-height:1.2}
header p{margin:0;color:#c9d1e0;font-size:14.5px}
header nav{display:flex;gap:8px}
header nav a,header nav button{font:inherit;font-size:13.5px;color:var(--paper);background:none;border:1.5px solid #4a5a78;padding:7px 12px;cursor:pointer;text-decoration:none}
header nav a:hover,header nav button:hover{border-color:var(--paper)}
main{max-width:1240px;margin:0 auto;padding:4px 20px 40px}
section{margin-top:22px}
h2{font-family:"Gowun Batang",serif;font-size:20px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
h2 .no{display:inline-grid;place-items:center;width:28px;height:28px;border:2px solid var(--seal);color:#e8857b;font-size:15px;transform:rotate(-6deg);flex:none;align-self:center}
h2 small{font-family:"IBM Plex Sans KR",sans-serif;font-size:13px;color:#93a0b8;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.card{background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.45);padding:10px 10px 11px;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;cursor:pointer}
.card:hover,.card:focus-visible{transform:translateY(-2px);outline:none;box-shadow:0 6px 0 rgba(0,0,0,.45)}
.qr{background:#fff;aspect-ratio:1;display:grid;place-items:center}
.qr svg{width:100%;height:100%;display:block}
.card b{font-family:"Gowun Batang",serif;font-size:17px;line-height:1.25}
.card span{font-size:12.5px;color:var(--muted)}
.card.empty{cursor:default;background:transparent;color:#93a0b8;border:2px dashed #4a5a78;box-shadow:none}
.card.empty:hover{transform:none}
.card.empty .qr{background:none;border:1px dashed #4a5a78;font-size:13px;text-align:center;padding:10px}
footer{max-width:1240px;margin:0 auto;padding:0 20px 34px;color:#93a0b8;font-size:12.5px}
/* 크게 보기 */
#big{position:fixed;inset:0;background:rgba(10,14,24,.94);display:none;place-items:center;padding:20px;z-index:9}
#big.on{display:grid}
#big .box{background:var(--paper);color:var(--ink);border:4px solid var(--ink);padding:22px;width:min(560px,92vw,calc(100vh - 150px));text-align:center}
#big .qr{width:100%;margin-bottom:14px}
#big b{display:block;font-family:"Gowun Batang",serif;font-size:clamp(22px,4vw,30px)}
#big a{display:block;color:var(--indigo);font-size:14px;word-break:break-all;margin-top:4px}
#big .hint{font-size:12px;color:var(--muted);margin-top:10px}
@media print{
  body{background:#fff;color:#000}
  header nav,#big{display:none!important}
  header p,h2 small,footer{color:#444}
  .card{box-shadow:none;break-inside:avoid}
  .card.empty{display:none}
  h2 .no{color:var(--seal)}
}
</style>
</head>
<body>
<header>
  <div>
    <div class="eb">휴대폰 카메라로 비추면 바로 열려요</div>
    <h1>QR 한눈에 보기</h1>
    <p>지금까지 만든 게임·행사·자료를 한 화면에 모았어요. QR을 누르면 크게 보여요.</p>
  </div>
  <nav><a href="./">카드로 보기</a><button type="button" onclick="print()">인쇄</button></nav>
</header>
<main id="list"></main>
<footer>경포고등학교 한예지 · <span id="cnt"></span></footer>
<div id="big" role="dialog" aria-modal="true" aria-label="QR 크게 보기"><div class="box"><div class="qr"></div><b></b><a target="_blank" rel="noopener"></a><div class="hint">아무 곳이나 누르거나 Esc를 누르면 닫혀요</div></div></div>
<script>
/* 묶음마다 주소를 넣는다. url을 ""로 두면 '주소를 넣어 주세요' 자리로 보인다. */
const GROUPS=[
  {title:"고전 소설 RPG 게임",note:"작품을 걸으며 읽는 수업용 게임",items:[
    {title:"굴러라, 금방울",sub:"「금방울전」",url:"https://519-tn2020-71-bit.github.io/geumbanguljeon/"},
    {title:"비장이 된 아내",sub:"「이춘풍전」",url:"https://519-tn2020-71-bit.github.io/leechunpung/"},
    {title:"풍운의 증표",sub:"「장풍운전」",url:"https://519-tn2020-71-bit.github.io/jangpungun/"},
    {title:"연광정의 북소리",sub:"「옥단춘전」",url:"https://519-tn2020-71-bit.github.io/okdanchun/"},
    {title:"피리 소리, 바다 건너",sub:"「최척전」",url:"https://519-tn2020-71-bit.github.io/choicheok/"},
    {title:"젖은 발자국",sub:"「장화홍련전」 짜임의 추리",url:"https://519-tn2020-71-bit.github.io/janghwa/"}
  ]},
  {title:"뉴스레터",note:"",items:[{title:"뉴스레터",sub:"구글 앱스 스크립트",url:"https://script.google.com/macros/s/AKfycbwn8-nPNz1UzuCzcu9MrwgIUgd1F_WbyRVvoBWCnFbg1zuyOkBV8lId5U5d3FAXm6KtDQ/exec"}]},
  {title:"한글날 행사",note:"",items:[
    {title:"스물여덟 자의 비밀",sub:"한글날 서사 RPG",url:"https://519-tn2020-71-bit.github.io/hangeul/"}
  ]},
  {title:"사회 문제 알리는 영상전",note:"",items:[{title:"사회 문제 알리는 영상전",sub:"",url:"https://files-mentioned-by-the-user-codex-blond.vercel.app/"}]},
  {title:"연수 정리",note:"",items:[{title:"AI 연수 자료 모음",sub:"2026년 연수 14개",url:"https://519-tn2020-71-bit.github.io/yeonsu/"}]},
  {title:"학생 AI 챌린지",note:"AI 디지털 선도학교 행사",items:[
    {title:"진짜를 가려라 체험판",sub:"누구나 체험 계정으로 들어가요",url:"https://ai-check-demo.jihan10.workers.dev/"}
  ]}
];
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const qrSvg=url=>{try{const q=qrcode(0,"M");q.addData(url);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true});}catch(e){return '<span style="font-size:12px;padding:8px">QR을 만들지 못했어요</span>';}};
const host=u=>u.replace(/^https?:\/\//,"").replace(/\/$/,"");
let n=0;
document.getElementById("list").innerHTML=GROUPS.map((g,i)=>`<section><h2><span class="no">${i+1}</span>${esc(g.title)}${g.note?`<small>${esc(g.note)}</small>`:""}</h2><div class="grid">${g.items.map(it=>{
  if(!it.url)return `<div class="card empty"><div class="qr">주소를 넣어 주세요</div><b>${esc(it.title)}</b></div>`;
  n++;return `<button type="button" class="card" data-url="${esc(it.url)}" data-title="${esc(it.title)}"><div class="qr">${qrSvg(it.url)}</div><b>${esc(it.title)}</b><span>${esc(it.sub||host(it.url))}</span></button>`;
}).join("")}</div></section>`).join("");
document.getElementById("cnt").textContent="QR "+n+"개";
const big=document.getElementById("big");
document.addEventListener("click",e=>{
  const c=e.target.closest("button.card");
  if(c){big.querySelector(".qr").innerHTML=qrSvg(c.dataset.url);big.querySelector("b").textContent=c.dataset.title;const a=big.querySelector("a");a.href=c.dataset.url;a.textContent=host(c.dataset.url);big.classList.add("on");return;}
  if(big.classList.contains("on")&&!e.target.closest("#big a"))big.classList.remove("on");
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")big.classList.remove("on");});
</script>
</body>
</html>
