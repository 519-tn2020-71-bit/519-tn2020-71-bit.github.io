<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>QR 한눈에 보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="site.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
.qgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.qcard{background:var(--card);border-radius:14px;padding:12px 12px 13px;display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;color:var(--text);border:0;cursor:pointer;transition:transform .15s}
.qcard:hover,.qcard:focus-visible{transform:translateY(-3px);outline:none}
.qcard .qr{background:#fff;border-radius:10px;aspect-ratio:1;display:grid;place-items:center;padding:6px;border-top:5px solid var(--tint)}
.qcard .qr svg{width:100%;height:100%;display:block}
.qcard b{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.35}
.qcard span{font-size:12.5px;color:var(--muted)}
#big{position:fixed;inset:0;background:rgba(8,12,24,.94);display:none;place-items:center;padding:20px;z-index:9}
#big.on{display:grid}
#big .box{background:#fff;color:#0f172a;border-radius:18px;padding:22px;width:min(540px,92vw,calc(100vh - 150px));text-align:center;border-top:10px solid var(--tint,#2563eb)}
#big .qr{width:100%;margin-bottom:12px}#big .qr svg{width:100%;height:auto;display:block}
#big b{display:block;font-size:clamp(22px,4vw,30px);font-weight:800;letter-spacing:-.02em}
#big a{display:block;color:#2563eb;font-size:14px;word-break:break-all;margin-top:4px}
#big .hint{font-size:12px;color:#64748b;margin-top:10px}
@media print{.hero .acts,#big{display:none!important}.qcard{border:1px solid #ccc}}
</style>
</head>
<body>
<header class="hero">
  <div class="in">
    <a class="crumb" href="./">← 수업용 게임과 도구 모음</a>
    <h1>QR 한눈에 보기</h1>
    <p>지금까지 만든 게임·행사·자료를 한 화면에 모았어요. 휴대폰 카메라로 비추면 바로 열리고, QR을 누르면 크게 보여요.</p>
    <div class="acts"><button class="btn" type="button" onclick="print()">인쇄하기</button></div>
  </div>
</header>
<main class="wrap" id="list"></main>
<footer class="foot">경포고등학교 한예지 · <span id="cnt"></span></footer>
<div id="big" role="dialog" aria-modal="true" aria-label="QR 크게 보기"><div class="box"><div class="qr"></div><b></b><a target="_blank" rel="noopener"></a><div class="hint">아무 곳이나 누르거나 Esc를 누르면 닫혀요</div></div></div>
<script>
/* 묶음마다 주소를 넣는다. color: 묶음 색(site.css의 --blue 등) */
const GROUPS=[
  {title:"고전 소설 RPG 게임",note:"작품을 걸으며 읽는 수업용 게임",color:"blue",items:[
    {title:"굴러라, 금방울",sub:"「금방울전」",url:"https://519-tn2020-71-bit.github.io/geumbanguljeon/"},
    {title:"비장이 된 아내",sub:"「이춘풍전」",url:"https://519-tn2020-71-bit.github.io/leechunpung/"},
    {title:"풍운의 증표",sub:"「장풍운전」",url:"https://519-tn2020-71-bit.github.io/jangpungun/"},
    {title:"연광정의 북소리",sub:"「옥단춘전」",url:"https://519-tn2020-71-bit.github.io/okdanchun/"},
    {title:"피리 소리, 바다 건너",sub:"「최척전」",url:"https://519-tn2020-71-bit.github.io/choicheok/"},
    {title:"젖은 발자국",sub:"「장화홍련전」 짜임의 추리",url:"https://519-tn2020-71-bit.github.io/janghwa/"}
  ]},
  {title:"뉴스레터",note:"",color:"teal",items:[{title:"뉴스레터",sub:"구글 앱스 스크립트",url:"https://script.google.com/macros/s/AKfycbwn8-nPNz1UzuCzcu9MrwgIUgd1F_WbyRVvoBWCnFbg1zuyOkBV8lId5U5d3FAXm6KtDQ/exec"}]},
  {title:"한글날 행사",note:"",color:"amber",items:[
    {title:"스물여덟 자의 비밀",sub:"한글날 서사 RPG",url:"https://519-tn2020-71-bit.github.io/hangeul/"}
  ]},
  {title:"사회 문제 알리는 영상전",note:"",color:"pink",items:[{title:"사회 문제 알리는 영상전",sub:"",url:"https://files-mentioned-by-the-user-codex-blond.vercel.app/"}]},
  {title:"연수 정리",note:"",color:"green",items:[{title:"AI 연수 자료 모음",sub:"2026년 연수 14개",url:"https://519-tn2020-71-bit.github.io/yeonsu/"}]},
  {title:"학생 AI 챌린지",note:"AI 디지털 선도학교 행사",color:"violet",items:[
    {title:"진짜를 가려라 체험판",sub:"누구나 체험 계정으로 들어가요",url:"https://ai-check-demo.jihan10.workers.dev/"}
  ]}
];
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const qrSvg=url=>{try{const q=qrcode(0,"M");q.addData(url);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true});}catch(e){return '<span style="font-size:12px;color:#334155">QR을 만들지 못했어요</span>';}};
const host=u=>u.replace(/^https?:\/\//,"").replace(/\/$/,"");
let n=0;
document.getElementById("list").innerHTML=GROUPS.map((g,i)=>`<section><h2 class="sec"><span class="num" style="background:var(--${g.color})">${i+1}</span>${esc(g.title)}${g.note?`<small>${esc(g.note)}</small>`:""}</h2><div class="qgrid">${g.items.filter(it=>it.url).map(it=>{
  n++;return `<button type="button" class="qcard" style="--tint:var(--${g.color})" data-url="${esc(it.url)}" data-title="${esc(it.title)}" data-color="${g.color}"><div class="qr">${qrSvg(it.url)}</div><b>${esc(it.title)}</b><span>${esc(it.sub||host(it.url))}</span></button>`;
}).join("")}</div></section>`).join("");
document.getElementById("cnt").textContent="QR "+n+"개";
const big=document.getElementById("big");
document.addEventListener("click",e=>{
  const c=e.target.closest("button.qcard");
  if(c){big.style.setProperty("--tint","var(--"+c.dataset.color+")");big.querySelector(".qr").innerHTML=qrSvg(c.dataset.url);big.querySelector("b").textContent=c.dataset.title;const a=big.querySelector("a");a.href=c.dataset.url;a.textContent=host(c.dataset.url);big.classList.add("on");return;}
  if(big.classList.contains("on")&&!e.target.closest("#big a"))big.classList.remove("on");
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")big.classList.remove("on");});
</script>
</body>
</html>
