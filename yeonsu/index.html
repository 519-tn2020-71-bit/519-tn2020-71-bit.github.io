<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 연수 자료 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{--paper:#f6f1e4;--card:#fffdf7;--ink:#1d1813;--muted:#6b5f4c;--line:#d8ccb0;--seal:#b3362b;--indigo:#2b4a6f;--pale:#e9eef5;--bg:#161f31}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR","Malgun Gothic",sans-serif;line-height:1.65;font-size:16px}
.top{background:var(--bg);color:#f3ecdb}
.top .in{max-width:980px;margin:0 auto;padding:38px 20px 26px}
.eb{font-size:12px;letter-spacing:.2em;color:#e3c9a0}
h1{font-family:"Gowun Batang",serif;font-size:clamp(30px,6vw,44px);line-height:1.2;margin:8px 0 10px}
.top p{margin:0;color:#c9d1e0;max-width:40em}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .in{max-width:980px;margin:0 auto;padding:10px 20px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar button{font:inherit;font-size:14px;color:var(--indigo);background:var(--card);border:1.5px solid var(--line);padding:5px 12px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.bar input{font:inherit;font-size:14px;flex:1 1 160px;min-width:0;border:1.5px solid var(--line);background:var(--card);padding:5px 10px}
main{max-width:980px;margin:0 auto;padding:18px 20px 40px}
.month{font-family:"Gowun Batang",serif;font-size:20px;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.month::after{content:"";flex:1;border-top:1px solid var(--line)}
.list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
article{background:var(--card);border:2px solid var(--ink);box-shadow:0 4px 0 rgba(29,24,19,.18);padding:14px 16px 15px;display:flex;flex-direction:column;gap:6px}
article .date{font-size:12.5px;font-weight:600;color:var(--seal);letter-spacing:.03em}
article h2{font-family:"Gowun Batang",serif;font-size:19px;line-height:1.35;margin:0}
article .who{font-size:13.5px;color:var(--muted)}
article p{margin:0;font-size:14.5px}
article ul{margin:0;padding-left:1.15em;font-size:14.5px}
article .tags{display:flex;gap:5px;flex-wrap:wrap}
article .tags span{font-size:11.5px;color:var(--indigo);background:var(--pale);padding:1px 7px}
.links{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:8px}
.links a{display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink);border:1.5px solid var(--line);background:#fff;padding:7px 10px;font-size:14.5px;font-weight:500}
.links a:hover,.links a:focus-visible{border-color:var(--indigo);outline:none}
.links a small{font-size:11.5px;color:var(--muted);font-weight:400;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:30px}
footer{max-width:980px;margin:0 auto;padding:0 20px 40px;font-size:13px;color:var(--muted)}
footer a{color:var(--indigo)}
@media print{.bar{display:none}.top{background:#fff;color:#000}.top p{color:#333}article{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="eb">경포고등학교 선생님들이 들은 연수</div>
  <h1>AI 연수 자료 모음</h1>

</div></div>
<div class="bar"><div class="in" id="bar">
  <button type="button" data-t="" aria-pressed="true">전체</button>
  <button type="button" data-t="앱 만들기" aria-pressed="false">앱 만들기</button>
  <button type="button" data-t="AI 에이전트" aria-pressed="false">AI 에이전트</button>
  <button type="button" data-t="도구 활용" aria-pressed="false">도구 활용</button>
  <button type="button" data-t="AI 수업·윤리" aria-pressed="false">AI 수업·윤리</button>
  <input type="search" id="q" placeholder="찾기 (예: 노션, 클로드)" aria-label="연수 찾기">
</div></div>
<main id="main"></main>

  {date:"2026-06-12",when:"2026. 6. 12.~13.",title:"학교 자율적 교육과정 직무연수(AI 융합교육)",who:"대학과 함께하는 직무연수",tags:["AI 수업·윤리","도구 활용"],
   list:["AI를 활용한 데이터 분석과 시각화","AI로 결과물 만들기(PPT, 심층 보고서, 카드뉴스, hwpx 양식 채우기)","Vrew로 영상 만들기","AI를 활용한 PBL 설계"],
   links:[["강의 요약","https://canva.link/55jino7k5dxfvej"],["강의 자료 모음","http://zrr.kr/YjqkeS"]]},
  {date:"2026-05-23",when:"2026. 5. 23.",title:"AI 디지털교육 프로슈머 입문 연수",who:"박형호·최진우 선생님",tags:["앱 만들기"],
   desc:"AI를 활용한 자동화 워크플로와, Antigravity로 나만의 교육 앱 만들기.",
   links:[["강의 요약(캔바)","https://canva.link/epohe5xaeiwmpux"],["강의 교안 1(박형호 선생님)","http://gw1.kr/26aip"],["강의 교안 2(최진우 선생님)","http://gw1.kr/26vive"]]},
  {date:"2026-05-13",when:"2026. 5. 13.",title:"바이브코딩 연수",who:"남궁연(설악고)",tags:["앱 만들기"],
   desc:"구글 앱스 스크립트(GAS)를 활용하는 법과, VS Code로 사이트를 배포하는 법. 패들렛에 프롬프트 예시와 접속·배포 방법이 있어 혼자서도 따라 할 수 있어요. 강의 원고에는 연수에서 다루지 않은 공공 API 활용법도 있어요.",
   links:[["전체 자료 패들렛","https://padlet.com/seolak/_-h3ogaukron08yg4h"],["연수 자료(캔바)","https://www.canva.com/design/DAHJdyJNbNg/5puhJPujjuy_Wzcx0v_yNQ/view"]]},
  {date:"2026-04-29",when:"2026. 4. 29.",title:"AI와 웹앱을 통한 학생 자료 수집 및 생기부 초안 생성",who:"지연호(원주여고)",tags:["앱 만들기","도구 활용"],
   desc:"연수에서 소개한 프로그램도 함께 올려요. 자리배정도우미는 주소창에 ‘gw1.kr/자리배정도우미’라고 쳐도 열려요.",
   links:[["연수 자료(교안)","https://outstanding-anemone-965.notion.site/20260429_-_-gw1-kr-350b6831fd638013b516c5f367482767"],["자리배정도우미","https://seating-assistant.vercel.app/"],["타이머","https://drive.google.com/file/d/1oqiU1Z8vrzlxY85q0P7OW-6arnIqM_ss/view?usp=sharing"],["PDF 편집기","https://drive.google.com/file/d/1x6BQ2Jz5T0xlad-3qYtxcQI8dQKQp8vH/view?usp=sharing"],["손목지키미","https://drive.google.com/file/d/1Ham5ViSIrpqRqqlbH6-bg5XE7wXvn6K0/view?usp=sharing"],["스쿨보드","https://schoolboard.hoddok.net/"]]},
  {date:"2026-04-25",when:"2026. 4. 25.~26.",title:"Antigravity를 활용한 바이브코딩(AI SW교육 연수)",who:"지연호(원주여고)",tags:["앱 만들기"],
   desc:"Antigravity로 바이브코딩하는 방법(프롬프트 포함). 쓰는 생성형 AI가 챗GPT라면 코덱스, 클로드라면 클로드 코드, 제미나이라면 Antigravity를 쓰면 돼요.",
   list:["HTML: 웹 페이지의 전체 구조","CSS: 웹 페이지의 디자인","JS(자바스크립트): 움직이는 기능","‘바닐라’: 토핑 없는 바닐라 아이스크림처럼 다른 도구 없이 기본만 쓰는 것"],
   links:[["연수 자료(교안)","https://outstanding-anemone-965.notion.site/20260514_AI-SW-gw1-kr-AI-34bb6831fd638062976be07b7a1585ba"]]},
  {date:"2026-04-22",when:"2026. 4. 22.",title:"캔바 활용 연수",who:"한예지(경포고)",tags:["도구 활용"],
   desc:"프레젠테이션으로 열고 목차의 글자를 누르면 그 슬라이드로 넘어가요. 목차로 돌아가려면 오른쪽의 빨간 태그를 누르세요.",
   links:[["연수 자료(캔바)","https://canva.link/stdejkn3uknts26"]]},
  {date:"2026-04-08",when:"2026. 4. 8.",title:"강원 아이로 활용 연수",who:"한예지(경포고)",tags:["도구 활용"],
   desc:"강원 아이로의 기능을 익히는 연수.",
   links:[["연수 자료(캔바)","https://canva.link/e0ae3bokadfrze8"],["매뉴얼(교사용)","https://drive.google.com/file/d/1pPz9juLtURvG1lN3POPUUiO7VN5n1NaQ/view?usp=sharing"],["매뉴얼(학생용)","https://drive.google.com/file/d/1XTAPKqaWTLv3Pkj_3V-FY7pQZfNMy9QZ/view?usp=sharing"]]}
];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const HOST={"padlet.com":"패들렛","canva.link":"캔바","www.canva.com":"캔바","docs.google.com":"구글 슬라이드","drive.google.com":"구글 드라이브","github.com":"깃허브","gw1.kr":"단축 주소","zrr.kr":"단축 주소"};
const hostOf=u=>{const h=new URL(u).host;return HOST[h]||(h.endsWith("notion.site")?"노션":h.endsWith("github.io")?"웹 페이지":h.endsWith("vercel.app")?"웹앱":"웹 페이지");};
let tag="",q="";
function render(){
  const k=q.trim().toLowerCase();
  const rows=T.filter(t=>(!tag||t.tags.includes(tag))&&(!k||[t.title,t.who,t.desc||"",(t.list||[]).join(" "),t.links.map(l=>l[0]).join(" ")].join(" ").toLowerCase().includes(k)));
  if(!rows.length){document.getElementById("main").innerHTML='<p class="empty">맞는 연수가 없어요.</p>';return;}
  let html="",cur="";
  for(const t of rows){
    const m=t.date.slice(0,7);
    if(m!==cur){if(cur)html+="</div>";cur=m;html+=`<h2 class="month">${+m.slice(0,4)}년 ${+m.slice(5)}월</h2><div class="list">`;}
    html+=`<article><div class="date">${esc(t.when)}</div><h2>${esc(t.title)}</h2><div class="who">강사 ${esc(t.who)}</div>`
      +(t.desc?`<p>${esc(t.desc)}</p>`:"")+(t.list?`<ul>${t.list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"")
      +`<div class="tags">${t.tags.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`
      +`<div class="links">${t.links.map(([n,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}<small>${hostOf(u)} ↗</small></a>`).join("")}</div></article>`;
  }
  document.getElementById("main").innerHTML=html+"</div>";
}
document.getElementById("bar").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tag=b.dataset.t;document.querySelectorAll("#bar button").forEach(x=>x.setAttribute("aria-pressed",x===b));render();});
document.getElementById("q").addEventListener("input",e=>{q=e.target.value;render();});
render();
</script>
</body>
</html>
