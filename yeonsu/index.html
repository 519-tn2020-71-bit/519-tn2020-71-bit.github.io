const COLOR={"앱 만들기":"c-green","AI 에이전트":"c-blue","도구 활용":"c-amber","AI 수업·윤리":"c-pink"};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let tag="",q="";
function render(){
  const k=q.trim().toLowerCase();
  const rows=T.filter(t=>(!tag||t.tags.includes(tag))&&(!k||[t.title,t.who,t.desc,t.links.map(l=>l[0]).join(" ")].join(" ").toLowerCase().includes(k)));
  if(!rows.length){document.getElementById("main").innerHTML='<p class="empty">맞는 연수가 없어요.</p>';return;}
  let html="",cur="";
  for(const t of rows){
    const m=t.date.slice(0,7);
    if(m!==cur){if(cur)html+="</div>";cur=m;html+=`<h2 class="sec">${+m.slice(5)}월<small>${m.slice(0,4)}</small></h2><div class="grid">`;}
    html+=`<article class="card"><div class="cover ${COLOR[t.tags[0]]}"><span class="dt">${esc(t.when)}</span><span class="big">${esc(t.cover).replace(/\n/g,"<br>")}</span><span class="tg">${t.tags.map(esc).join(" · ")}</span></div>`
      +`<div class="body"><h3>${esc(t.title)}</h3><div class="who">${esc(t.who)}</div><p>${esc(t.desc)}</p>`
      +`<div class="ln">${t.links.map(([n,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)} ↗</a>`).join("")}</div></div></article>`;
  }
  document.getElementById("main").innerHTML=html+"</div>";
}
document.getElementById("bar").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tag=b.dataset.t;document.querySelectorAll("#bar button").forEach(x=>x.setAttribute("aria-pressed",x===b));render();});
document.getElementById("q").addEventListener("input",e=>{q=e.target.value;render();});
render();
</script>
